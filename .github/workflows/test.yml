name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Clean module passes
        uses: ./
        with:
          paths: tests/clean
      - name: Module with findings fails
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          paths: tests/dirty
      - name: Check that it failed
        shell: bash
        env:
          OUTCOME: ${{ steps.dirty.outcome }}
        run: test "$OUTCOME" = failure

  sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Clean module passes and uploads
        uses: ./
        with:
          paths: tests/clean
          sarif: true
